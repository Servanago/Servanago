name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=20m ./cmd/... ./internal/...
          install-mode: goinstall # release binary is built with go1.24, go.mod needs 1.26
          verify: false # config verify downloads a schema from golangci-lint.run; its timeout failed a release run
      - uses: oven-sh/setup-bun@v2
      - name: Install Playwright browser
        run: cd e2e && bun install --frozen-lockfile && bunx playwright install --with-deps chromium
      - run: make check
