{{define "content"}}
<h1>Domains</h1>
<article>
{{if .Data}}
<table>
<thead><tr><th>Domain</th><th>Default IP</th><th>Certificates</th><th>Routes</th><th></th></tr></thead>
<tbody>
{{range .Data}}
<tr>
<td>{{.Name}}</td><td>{{.DefaultIP}}</td><td>{{.CertMode}}</td><td>{{.Routes}}</td>
<td><button class="outline danger" hx-delete="/domains/{{.ID}}" hx-target="#msg" hx-confirm="Remove {{.Name}}? DNS records and certificates are not touched.">Remove</button></td>
</tr>
{{end}}
</tbody>
</table>
{{else}}<p>No domains yet.</p>{{end}}
<p id="msg" role="alert"></p>
</article>
<article>
<header>Add domain</header>
<form hx-post="/domains" hx-target="#msg">
<label>Domain <input name="name" placeholder="example.com" required></label>
<label>Default IP for A records <input name="default_ip" placeholder="192.168.1.10" required></label>
<label>Certificates
<select name="cert_mode">
<option value="wildcard">Wildcard (one *.domain certificate)</option>
<option value="per_host">Per host (one certificate per route)</option>
</select></label>
<button type="submit">Add domain</button>
</form>
</article>
{{end}}
