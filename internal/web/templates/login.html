{{define "content"}}
<div class="login-box">
<div class="login-brand">
<img src="/static/servanago-mark.svg" alt="" width="86" height="96">
<span class="wordmark">Care<b>takarr</b></span>
</div>
<article>
<h1>Sign in</h1>
<form id="login-form" hx-post="/login" hx-target="#msg">
<input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" autofocus required>
{{with .Data.SiteKey}}<div class="cf-turnstile" data-sitekey="{{.}}" data-action="login"></div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{{end}}
<button type="submit">Sign in</button>
{{if .Data.Passkeys}}<button type="button" class="outline" id="passkey-login">Sign in with passkey</button>{{end}}
<p id="msg" role="alert"></p>
</form>
</article>
</div>
<script src="/static/auth.js" defer></script>
{{end}}
