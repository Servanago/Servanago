version: "2"
linters:
  enable:
    - errorlint
  settings:
    staticcheck:
      # match golangci-lint v1: fixes (QF) and style (ST) checks off
      checks: ["SA*"]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
